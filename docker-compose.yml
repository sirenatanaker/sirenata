services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: elearning-app
        container_name: elearning_app
        restart: unless-stopped
        volumes:
            - .:/var/www
            - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
        environment:
            # Application
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
            APP_URL: ${APP_URL:-https://sirenata.kemnaker.go.id}
            DEBUGBAR_ENABLED: "false"

            # Database — host pakai nama service container
            DB_CONNECTION: mysql
            DB_HOST: elearning_db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
            DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

            # Redis — host pakai nama service container
            REDIS_CLIENT: phpredis
            REDIS_HOST: elearning_redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}

            # Session — redis agar SSO state tidak hilang antar request
            SESSION_DRIVER: redis
            SESSION_LIFETIME: 120
            SESSION_SECURE_COOKIE: "true"
            SESSION_HTTP_ONLY: "true"
            SESSION_SAME_SITE: lax
            SESSION_DOMAIN: ${SESSION_DOMAIN:-}

            # Cache & Queue
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis

            # Logging — stderr lebih baik di Docker (tampil di docker logs)
            LOG_CHANNEL: stderr
            LOG_LEVEL: warning

            # SSO SiapKerja
            SIAPKERJA_CLIENT_ID: ${SIAPKERJA_CLIENT_ID:?Set SIAPKERJA_CLIENT_ID in .env}
            SIAPKERJA_CLIENT_SECRET: ${SIAPKERJA_CLIENT_SECRET:?Set SIAPKERJA_CLIENT_SECRET in .env}
            SIAPKERJA_REDIRECT_URI: ${SIAPKERJA_REDIRECT_URI:-https://sirenata.kemnaker.go.id/auth/callback}
        networks:
            - app_front
            - data_back
        security_opt:
            - no-new-privileges:true

    nginx:
        image: nginx:stable-alpine
        container_name: elearning_nginx
        restart: unless-stopped
        ports:
            - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8081}:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
        networks:
            - app_front
        depends_on:
            - app
        security_opt:
            - no-new-privileges:true

    elearning_db:
        image: mysql:8.0
        container_name: elearning_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
            MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - data_back
        security_opt:
            - no-new-privileges:true

    phpmyadmin_elearning:
        image: phpmyadmin/phpmyadmin
        container_name: elearning_phpmyadmin
        restart: unless-stopped
        profiles:
            - tools
        ports:
            - "127.0.0.1:8082:80"
        environment:
            PMA_HOST: elearning_db
        networks:
            - data_back
        depends_on:
            - elearning_db
        security_opt:
            - no-new-privileges:true

    elearning_redis:
        image: redis:alpine
        container_name: elearning_redis
        restart: unless-stopped
        networks:
            - data_back
        security_opt:
            - no-new-privileges:true

networks:
    app_front:
        driver: bridge
    data_back:
        driver: bridge
        internal: true

volumes:
    dbdata:
