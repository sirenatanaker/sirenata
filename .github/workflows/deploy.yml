name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy Application
        run: |
          cd ${{ secrets.DEPLOY_PATH }}

          # 1. Bersihkan draf/perubahan lokal di VPS agar tidak bentrok saat git pull
          git reset --hard HEAD
          git clean -fd

          # 2. Tarik update kode terbaru dari GitHub
          git pull origin main

          # 3. Rebuild & jalankan container jika ada perubahan pada docker-compose / Dockerfile
          docker compose up -d --build

          # 4. Jalankan perintah manajemen dependency & optimasi Laravel
          docker exec elearning_app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          docker exec elearning_app npm install
          docker exec elearning_app npm run build

          docker exec elearning_app php artisan migrate --force

          docker exec elearning_app php artisan config:cache
          docker exec elearning_app php artisan route:cache
          docker exec elearning_app php artisan view:cache
          docker exec elearning_app php artisan event:cache

          docker exec elearning_app php artisan queue:restart