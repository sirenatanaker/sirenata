name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy Application
        run: |
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"

          OLD_HEAD=$(git rev-parse HEAD)
          git fetch origin main
          git pull --ff-only origin main
          NEW_HEAD=$(git rev-parse HEAD)

          CHANGED_FILES=$(git diff --name-only "$OLD_HEAD" "$NEW_HEAD" || true)

          # 1. Composer install hanya saat composer.json/lock berubah atau vendor belum ada
          if [ ! -d vendor ] || echo "$CHANGED_FILES" | grep -Eq '^(composer\.json|composer\.lock)$'; then
            echo ">> Installing Composer dependencies..."
            docker exec elearning_app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          else
            echo ">> Refreshing optimized autoloader..."
            docker exec elearning_app composer dump-autoload --no-dev --optimize
          fi

          # 2. npm ci hanya saat package.json/lock berubah atau node_modules belum ada
          if [ ! -d node_modules ] || echo "$CHANGED_FILES" | grep -Eq '^(package\.json|package-lock\.json)$'; then
            echo ">> Installing npm dependencies..."
            docker exec elearning_app npm ci --no-audit --no-fund
          else
            echo ">> Skipping npm ci (no package lockfile change)"
          fi

          # 3. Build Vite hanya saat ada perubahan aset/Blade/konfigurasi atau manifest belum ada
          if [ ! -f public/build/manifest.json ] || echo "$CHANGED_FILES" | grep -Eq '(^resources/|^Modules/.*/resources/|^package(-lock)?\.json$|^vite\.config\.|^tailwind\.config\.|^postcss\.config\.)'; then
            echo ">> Building Vite assets..."
            docker exec elearning_app npm run build
          else
            echo ">> Skipping npm run build (no frontend changes)"
          fi

          # 4. Pastikan permission storage & bootstrap/cache aman untuk php-fpm (www-data)
          docker exec elearning_app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

          # 5. Migrasi database
          docker exec -u www-data elearning_app php artisan migrate --force

          # 6. Clear cache lama terlebih dulu agar route/view/config baru tidak memicu 500
          docker exec -u www-data elearning_app php artisan optimize:clear
          docker exec -u www-data elearning_app php artisan config:cache
          docker exec -u www-data elearning_app php artisan route:cache
          docker exec -u www-data elearning_app php artisan view:cache
          docker exec -u www-data elearning_app php artisan event:cache

          # 7. Pastikan container queue worker menyala di latar belakang & reload dengan kode terbaru
          docker compose up -d queue_grading || true
          docker exec -u www-data elearning_app php artisan queue:restart
