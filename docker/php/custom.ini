; Menyembunyikan pesan error dari publik
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1

; Menaikkan batas input untuk mencegah peringatan PHP Warning dari pemindai WAS
max_input_vars = 3000

; Batas Maksimal Upload Berkas (Video Materi, Dokumen, dll.)
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
